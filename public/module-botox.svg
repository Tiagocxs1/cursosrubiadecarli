<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F8"/>

  <!-- Background subtle pattern -->
  <circle cx="650" cy="80" r="180" fill="#D4AF37" opacity="0.04"/>
  <circle cx="150" cy="420" r="120" fill="#D4AF37" opacity="0.05"/>

  <!-- Face silhouette -->
  <ellipse cx="400" cy="260" rx="130" ry="160" fill="white" stroke="#E8DDD5" stroke-width="1.5"/>
  <!-- Forehead -->
  <path d="M290 200 Q400 120 510 200" fill="white" stroke="#E8DDD5" stroke-width="1.5"/>

  <!-- Smooth skin texture lines (before - light) -->
  <path d="M330 195 Q400 180 470 195" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.3"/>
  <path d="M340 210 Q400 196 460 210" stroke="#D4AF37" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.2"/>

  <!-- Face features -->
  <!-- Eyes -->
  <ellipse cx="355" cy="270" rx="22" ry="12" fill="none" stroke="#4A3F35" stroke-width="1.8"/>
  <ellipse cx="445" cy="270" rx="22" ry="12" fill="none" stroke="#4A3F35" stroke-width="1.8"/>
  <circle cx="355" cy="270" r="6" fill="#4A3F35" opacity="0.7"/>
  <circle cx="445" cy="270" r="6" fill="#4A3F35" opacity="0.7"/>
  <!-- Eyebrows (relaxed/smooth) -->
  <path d="M333 252 Q355 246 377 250" stroke="#4A3F35" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M423 250 Q445 246 467 252" stroke="#4A3F35" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Nose -->
  <path d="M392 290 Q388 318 378 326 Q400 332 422 326 Q412 318 408 290" stroke="#4A3F35" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Lips (relaxed) -->
  <path d="M372 355 Q400 345 428 355" stroke="#4A3F35" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M370 355 Q400 372 430 355" stroke="#4A3F35" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Injection point - glabela -->
  <circle cx="400" cy="230" r="5" fill="#D4AF37"/>
  <circle cx="400" cy="230" r="9" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>

  <!-- Injection points - forehead -->
  <circle cx="360" cy="195" r="4" fill="#D4AF37" opacity="0.8"/>
  <circle cx="440" cy="195" r="4" fill="#D4AF37" opacity="0.8"/>
  <circle cx="400" cy="188" r="4" fill="#D4AF37" opacity="0.8"/>

  <!-- Injection points - lateral canthus -->
  <circle cx="326" cy="282" r="4" fill="#D4AF37" opacity="0.8"/>
  <circle cx="474" cy="282" r="4" fill="#D4AF37" opacity="0.8"/>

  <!-- Syringe - right side -->
  <g transform="translate(560, 230) rotate(-35)">
    <!-- Barrel -->
    <rect x="-8" y="-50" width="16" height="60" rx="3" fill="white" stroke="#D4AF37" stroke-width="1.5"/>
    <!-- Plunger -->
    <rect x="-6" y="-65" width="12" height="20" rx="2" fill="#D4AF37" opacity="0.3"/>
    <rect x="-10" y="-68" width="20" height="6" rx="2" fill="#D4AF37" opacity="0.5"/>
    <!-- Needle -->
    <rect x="-1.5" y="10" width="3" height="28" rx="1" fill="#C0A030"/>
    <!-- Tip -->
    <path d="M-1.5 38 L1.5 38 L0 46 Z" fill="#C0A030"/>
    <!-- Scale marks -->
    <line x1="-8" y1="-20" x2="-3" y2="-20" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
    <line x1="-8" y1="-5" x2="-3" y2="-5" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
    <line x1="-8" y1="10" x2="-3" y2="10" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Connection line from syringe tip to injection point -->
  <path d="M527 295 Q480 265 409 233" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Label -->
  <text x="400" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#4A3F35" opacity="0.7" letter-spacing="3">TOXINA BOTULÍNICA</text>
  <line x1="300" y1="463" x2="500" y2="463" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>

  <!-- Gold decorative corner -->
  <path d="M30 30 L70 30 L70 34 L34 34 L34 70 L30 70 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M770 30 L730 30 L730 34 L766 34 L766 70 L770 70 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M30 470 L70 470 L70 466 L34 466 L34 430 L30 430 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M770 470 L730 470 L730 466 L766 466 L766 430 L770 430 Z" fill="#D4AF37" opacity="0.4"/>
</svg>
