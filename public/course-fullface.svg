<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F8"/>
  <circle cx="400" cy="250" r="220" fill="#D4AF37" opacity="0.03"/>
  <circle cx="160" cy="120" r="130" fill="#D4AF37" opacity="0.03"/>
  <circle cx="640" cy="380" r="110" fill="#D4AF37" opacity="0.03"/>

  <!-- Face outline - elegant frontal -->
  <ellipse cx="400" cy="260" rx="148" ry="178" fill="white" stroke="#E0D4C4" stroke-width="1.5"/>
  <!-- Forehead curve -->
  <path d="M280 215 Q400 130 520 215" fill="white" stroke="#E0D4C4" stroke-width="1.5"/>

  <!-- Golden ratio guide lines (subtle) -->
  <!-- Horizontal thirds -->
  <line x1="270" y1="215" x2="530" y2="215" stroke="#D4AF37" stroke-width="0.6" stroke-dasharray="4 4" opacity="0.2"/>
  <line x1="262" y1="286" x2="538" y2="286" stroke="#D4AF37" stroke-width="0.6" stroke-dasharray="4 4" opacity="0.2"/>
  <line x1="268" y1="357" x2="532" y2="357" stroke="#D4AF37" stroke-width="0.6" stroke-dasharray="4 4" opacity="0.2"/>
  <!-- Vertical center -->
  <line x1="400" y1="140" x2="400" y2="420" stroke="#D4AF37" stroke-width="0.6" stroke-dasharray="4 4" opacity="0.15"/>

  <!-- Eyes -->
  <ellipse cx="350" cy="278" rx="28" ry="14" fill="none" stroke="#4A3F35" stroke-width="2"/>
  <ellipse cx="450" cy="278" rx="28" ry="14" fill="none" stroke="#4A3F35" stroke-width="2"/>
  <circle cx="351" cy="278" r="8" fill="#4A3F35" opacity="0.7"/>
  <circle cx="451" cy="278" r="8" fill="#4A3F35" opacity="0.7"/>
  <circle cx="347" cy="274" r="3" fill="white" opacity="0.5"/>
  <circle cx="447" cy="274" r="3" fill="white" opacity="0.5"/>
  <!-- Eyebrows - arched -->
  <path d="M322 257 Q352 247 380 252" stroke="#4A3F35" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M420 252 Q448 247 478 257" stroke="#4A3F35" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M392 300 Q386 332 374 342 Q400 350 426 342 Q414 332 408 300" stroke="#4A3F35" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M386 341 Q393 345 400 343 Q407 345 414 341" stroke="#4A3F35" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Lips -->
  <path d="M368 372 Q385 362 400 360 Q415 362 432 372" stroke="#4A3F35" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M368 372 Q400 390 432 372" fill="#D4AF37" opacity="0.1" stroke="#4A3F35" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M380 372 Q391 366 400 368 Q409 366 420 372" stroke="#4A3F35" stroke-width="1.1" fill="none"/>

  <!-- Treatment zone indicators -->
  <!-- Forehead zone -->
  <rect x="330" y="168" width="140" height="38" rx="6" fill="#D4AF37" opacity="0.06" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- Crow's feet left -->
  <path d="M305 272 Q295 265 288 280 Q295 290 305 286" fill="#D4AF37" opacity="0.08" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- Crow's feet right -->
  <path d="M495 272 Q505 265 512 280 Q505 290 495 286" fill="#D4AF37" opacity="0.08" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- Cheek zone left -->
  <ellipse cx="302" cy="322" rx="35" ry="25" fill="#D4AF37" opacity="0.06" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- Cheek zone right -->
  <ellipse cx="498" cy="322" rx="35" ry="25" fill="#D4AF37" opacity="0.06" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- Lips zone -->
  <rect x="358" y="358" width="84" height="42" rx="10" fill="#D4AF37" opacity="0.06" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 3"/>

  <!-- Injection dots -->
  <circle cx="358" cy="182" r="3.5" fill="#D4AF37" opacity="0.7"/>
  <circle cx="400" cy="178" r="3.5" fill="#D4AF37" opacity="0.7"/>
  <circle cx="442" cy="182" r="3.5" fill="#D4AF37" opacity="0.7"/>
  <circle cx="304" cy="278" r="3" fill="#D4AF37" opacity="0.6"/>
  <circle cx="496" cy="278" r="3" fill="#D4AF37" opacity="0.6"/>
  <circle cx="302" cy="320" r="3" fill="#D4AF37" opacity="0.6"/>
  <circle cx="498" cy="320" r="3" fill="#D4AF37" opacity="0.6"/>
  <circle cx="385" cy="370" r="3" fill="#D4AF37" opacity="0.6"/>
  <circle cx="415" cy="370" r="3" fill="#D4AF37" opacity="0.6"/>

  <!-- Φ golden ratio symbol -->
  <text x="680" y="420" font-family="Georgia, serif" font-size="80" fill="#D4AF37" opacity="0.07" font-style="italic">Φ</text>

  <!-- Label -->
  <text x="400" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#4A3F35" opacity="0.7" letter-spacing="3">PROTOCOLO FULL FACE</text>
  <line x1="295" y1="463" x2="505" y2="463" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>

  <!-- Gold corners -->
  <path d="M30 30 L70 30 L70 34 L34 34 L34 70 L30 70 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M770 30 L730 30 L730 34 L766 34 L766 70 L770 70 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M30 470 L70 470 L70 466 L34 466 L34 430 L30 430 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M770 470 L730 470 L730 466 L766 466 L766 430 L770 430 Z" fill="#D4AF37" opacity="0.4"/>
</svg>
