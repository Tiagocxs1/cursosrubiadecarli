name: Refresh and audit npm lockfile

on:
  push:
    branches:
      - maintenance/security-lock-refresh-20261117

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: maintenance/security-lock-refresh-20261117
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile lockfile with package.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Apply non-breaking security updates
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund

      - name: Generate final dependency audit
        continue-on-error: true
        run: |
          npm audit --json > npm-audit.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities || {};
          const lines = [
            '## npm security audit',
            '',
            '| Severity | Count |',
            '|---|---:|',
            ...['critical','high','moderate','low','info'].map(k => `|${k}|${counts[k] ?? 0}|`),
            '',
            `Total: ${counts.total ?? 0}`,
            '',
            '### Vulnerable direct/transitive packages',
            ...Object.entries(report.vulnerabilities || {}).map(([name, item]) =>
              `- **${name}** — ${item.severity}; fix: ${typeof item.fixAvailable === 'object' ? JSON.stringify(item.fixAvailable) : item.fixAvailable}`
            )
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: ignore

      - name: Commit regenerated lockfile
        run: |
          git add package-lock.json npm-audit.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: attach npm audit diagnostics"
            git push origin HEAD:maintenance/security-lock-refresh-20261117
          else
            echo "No lockfile or audit report changes."
          fi
