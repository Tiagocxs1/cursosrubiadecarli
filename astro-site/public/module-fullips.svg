<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F8"/>

  <!-- Subtle background -->
  <circle cx="400" cy="250" r="230" fill="#D4AF37" opacity="0.025"/>
  <circle cx="200" cy="150" r="120" fill="#D4AF37" opacity="0.03"/>

  <!-- Lips illustration - full, defined, premium -->

  <!-- Upper lip shadow -->
  <ellipse cx="400" cy="265" rx="115" ry="55" fill="#F0E0D0" opacity="0.6"/>

  <!-- Lower lip (fuller) -->
  <path d="M280 270 Q320 250 400 245 Q480 250 520 270 Q500 318 400 328 Q300 318 280 270 Z"
        fill="#E8C4A8" stroke="#C4906A" stroke-width="1.5"/>

  <!-- Upper lip -->
  <path d="M280 270 Q300 252 340 255 Q370 248 400 245 Q430 248 460 255 Q500 252 520 270"
        fill="#DDB090" stroke="#C4906A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cupid's bow - upper lip -->
  <path d="M340 268 Q360 258 380 262 Q400 255 420 262 Q440 258 460 268"
        fill="#D4A080" stroke="#B87850" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Philtrum columns -->
  <path d="M385 240 Q390 248 390 260" stroke="#C4906A" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M415 240 Q410 248 410 260" stroke="#C4906A" stroke-width="1" fill="none" opacity="0.4"/>

  <!-- Lip gloss highlight -->
  <ellipse cx="400" cy="298" rx="55" ry="16" fill="white" opacity="0.25"/>
  <ellipse cx="375" cy="294" rx="22" ry="7" fill="white" opacity="0.2"/>

  <!-- Upper lip highlight -->
  <path d="M360 260 Q380 255 395 258" stroke="white" stroke-width="2" opacity="0.3" stroke-linecap="round" fill="none"/>

  <!-- Volume indicator arrows -->
  <!-- Left -->
  <path d="M260 295 L238 295" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <path d="M246 288 L238 295 L246 302" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Right -->
  <path d="M540 295 L562 295" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <path d="M554 288 L562 295 L554 302" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Top -->
  <path d="M400 230 L400 210" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <path d="M393 218 L400 210 L407 218" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Bottom -->
  <path d="M400 340 L400 360" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  <path d="M393 352 L400 360 L407 352" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Small syringe - top right -->
  <g transform="translate(600, 200) rotate(30)">
    <rect x="-7" y="-45" width="14" height="55" rx="3" fill="white" stroke="#D4AF37" stroke-width="1.5"/>
    <rect x="-5" y="-58" width="10" height="16" rx="2" fill="#D4AF37" opacity="0.3"/>
    <rect x="-9" y="-61" width="18" height="5" rx="1.5" fill="#D4AF37" opacity="0.5"/>
    <rect x="-1.5" y="10" width="3" height="25" rx="1" fill="#C0A030"/>
    <path d="M-1.5 35 L1.5 35 L0 43 Z" fill="#C0A030"/>
  </g>

  <!-- "London" decorative text -->
  <text x="200" y="185" font-family="Georgia, serif" font-size="13" fill="#D4AF37" opacity="0.2" letter-spacing="6" font-style="italic">LONDON</text>
  <text x="560" y="380" font-family="Georgia, serif" font-size="13" fill="#D4AF37" opacity="0.2" letter-spacing="6" font-style="italic">FACE</text>

  <!-- Symmetry line -->
  <line x1="400" y1="175" x2="400" y2="195" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3"/>
  <line x1="400" y1="345" x2="400" y2="365" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3"/>

  <!-- Bottom label -->
  <text x="400" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#4A3F35" opacity="0.7" letter-spacing="3">FULLIPS LONDON FACE</text>
  <line x1="290" y1="463" x2="510" y2="463" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>

  <!-- Gold corners -->
  <path d="M30 30 L70 30 L70 34 L34 34 L34 70 L30 70 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M770 30 L730 30 L730 34 L766 34 L766 70 L770 70 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M30 470 L70 470 L70 466 L34 466 L34 430 L30 430 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M770 470 L730 470 L730 466 L766 466 L766 430 L770 430 Z" fill="#D4AF37" opacity="0.4"/>
</svg>
