<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" fill="#FAF9F8"/>
  <circle cx="600" cy="150" r="160" fill="#D4AF37" opacity="0.03"/>

  <!-- Large hair follicle cross-section - anatomical diagram -->

  <!-- Scalp surface -->
  <path d="M100 148 Q400 118 700 148" fill="#F5EDD8" stroke="#E0D0BC" stroke-width="1.5"/>
  <rect x="100" y="148" width="600" height="22" fill="#F5EDD8" opacity="0.8"/>

  <!-- Epidermis label -->
  <line x1="710" y1="158" x2="730" y2="158" stroke="#4A3F35" stroke-width="0.8" opacity="0.4"/>
  <text x="735" y="162" font-family="Georgia, serif" font-size="10" fill="#4A3F35" opacity="0.5" letter-spacing="1">EPIDERME</text>

  <!-- Dermis -->
  <rect x="100" y="170" width="600" height="140" fill="#F0E4D0" opacity="0.5"/>
  <line x1="710" y1="240" x2="730" y2="240" stroke="#4A3F35" stroke-width="0.8" opacity="0.4"/>
  <text x="735" y="244" font-family="Georgia, serif" font-size="10" fill="#4A3F35" opacity="0.5" letter-spacing="1">DERME</text>

  <!-- Hypodermis -->
  <rect x="100" y="310" width="600" height="100" fill="#E8D8B8" opacity="0.4"/>
  <line x1="710" y1="355" x2="730" y2="355" stroke="#4A3F35" stroke-width="0.8" opacity="0.4"/>
  <text x="735" y="359" font-family="Georgia, serif" font-size="10" fill="#4A3F35" opacity="0.5" letter-spacing="1">HIPODERME</text>

  <!-- === MAIN FOLLICLE === centered -->
  <!-- Outer root sheath -->
  <ellipse cx="380" cy="290" rx="52" ry="120" fill="#EAD4B4" stroke="#D4AF37" stroke-width="1.5" opacity="0.8"/>
  <!-- Inner root sheath -->
  <ellipse cx="380" cy="285" rx="36" ry="100" fill="#F0DFC0" opacity="0.9"/>
  <!-- Hair shaft -->
  <ellipse cx="380" cy="270" rx="14" ry="90" fill="#4A3F35" opacity="0.75"/>
  <!-- Medulla (hair core) -->
  <ellipse cx="380" cy="270" rx="5" ry="80" fill="#6A5F55" opacity="0.5"/>
  <!-- Hair above scalp -->
  <rect x="373" y="28" width="14" height="122" rx="7" fill="#4A3F35" opacity="0.75"/>
  <!-- Hair cuticle shine -->
  <rect x="375" y="35" width="4" height="110" rx="2" fill="white" opacity="0.12"/>

  <!-- Papilla (bulb) -->
  <ellipse cx="380" cy="390" rx="40" ry="22" fill="#D4AF37" opacity="0.55" stroke="#D4AF37" stroke-width="1.2"/>
  <!-- Papilla label -->
  <line x1="340" y1="392" x2="100" y2="410" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
  <text x="55" y="414" font-family="Georgia, serif" font-size="10" fill="#D4AF37" opacity="0.7" text-anchor="middle" letter-spacing="1">PAPILA</text>

  <!-- Sebaceous gland -->
  <ellipse cx="440" cy="222" rx="34" ry="22" fill="#D4AF37" opacity="0.18" stroke="#D4AF37" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="474" y1="222" x2="520" y2="200" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
  <text x="525" y="197" font-family="Georgia, serif" font-size="10" fill="#4A3F35" opacity="0.6" letter-spacing="1">GL. SEBÁCEA</text>

  <!-- Arrector pili muscle -->
  <path d="M432 195 Q460 250 455 320" stroke="#C4907A" stroke-width="3" fill="none" opacity="0.45" stroke-linecap="round"/>
  <line x1="460" y1="258" x2="530" y2="268" stroke="#C4907A" stroke-width="0.8" opacity="0.4"/>
  <text x="535" y="272" font-family="Georgia, serif" font-size="10" fill="#4A3F35" opacity="0.6" letter-spacing="1">M. ERETOR</text>

  <!-- Blood vessels -->
  <path d="M280" y1="378" stroke="#C4907A" stroke-width="0"/>
  <ellipse cx="380" cy="378" rx="50" ry="8" fill="none" stroke="#C4907A" stroke-width="1.8" opacity="0.35"/>
  <path d="M200 390 Q310 380 330 390" stroke="#C4907A" stroke-width="2.5" fill="none" opacity="0.3" stroke-linecap="round"/>
  <line x1="320" y1="384" x2="100" y2="388" stroke="#C4907A" stroke-width="0.8" opacity="0.35"/>
  <text x="55" y="392" font-family="Georgia, serif" font-size="10" fill="#4A3F35" opacity="0.5" text-anchor="middle" letter-spacing="1">VASOS</text>

  <!-- Shaft label -->
  <line x1="366" y1="75" x2="100" y2="75" stroke="#4A3F35" stroke-width="0.8" opacity="0.4"/>
  <text x="55" y="79" font-family="Georgia, serif" font-size="10" fill="#4A3F35" opacity="0.6" text-anchor="middle" letter-spacing="1">HASTE</text>

  <!-- Outer root sheath label -->
  <line x1="432" y1="300" x2="540" y2="315" stroke="#D4AF37" stroke-width="0.8" opacity="0.45"/>
  <text x="545" y="319" font-family="Georgia, serif" font-size="10" fill="#4A3F35" opacity="0.6" letter-spacing="1">BAINHA EXT.</text>

  <!-- Inner root sheath label -->
  <line x1="344" y1="340" x2="100" y2="345" stroke="#4A3F35" stroke-width="0.8" opacity="0.35"/>
  <text x="55" y="349" font-family="Georgia, serif" font-size="10" fill="#4A3F35" opacity="0.5" text-anchor="middle" letter-spacing="1">BAINHA INT.</text>

  <!-- Bottom label -->
  <text x="400" y="455" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#4A3F35" opacity="0.7" letter-spacing="3">ANATOMIA CAPILAR</text>
  <line x1="300" y1="463" x2="500" y2="463" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>

  <!-- Gold corners -->
  <path d="M30 30 L70 30 L70 34 L34 34 L34 70 L30 70 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M770 30 L730 30 L730 34 L766 34 L766 70 L770 70 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M30 470 L70 470 L70 466 L34 466 L34 430 L30 430 Z" fill="#D4AF37" opacity="0.4"/>
  <path d="M770 470 L730 470 L730 466 L766 466 L766 430 L770 430 Z" fill="#D4AF37" opacity="0.4"/>
</svg>
